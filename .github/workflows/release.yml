name: Build

# Builds the portable PerfectWallpaper.exe and the installer on every push. Pushing a tag
# such as v0.1.0 also publishes a GitHub release with both attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt -r requirements-build.txt -r requirements-models.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Get the AI engine
        run: python scripts/get_engine.py

      - name: Make the AI models from their original files
        run: python scripts/convert_models.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build both downloads
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: PerfectWallpaper
          path: |
            dist/PerfectWallpaper.exe
            dist/PerfectWallpaper-Setup-*.exe

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          gh release create "${{ github.ref_name }}" dist/PerfectWallpaper-Setup-*.exe dist/PerfectWallpaper.exe
          THIRD_PARTY_NOTICES.md --title "Perfect Wallpaper ${{ github.ref_name }}" --generate-notes
